<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Uma interface minimalista para leitura de repositórios públicos do GitHub." />
    <title>Repo Reader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Repo Reader — início">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Repo Reader</span>
      </a>
      <button id="theme-button" class="icon-button" type="button" aria-label="Alternar tema">◐</button>
    </header>

    <main>
      <section id="welcome" class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">Leitura sem distrações</p>
        <h1 id="welcome-title">Entenda um repositório,<br />arquivo por arquivo.</h1>
        <p class="intro">Cole a URL de um repositório público do GitHub ou informe <code>owner/repo</code>.</p>
        <form id="repo-form" class="repo-form">
          <label class="sr-only" for="repo-input">Repositório do GitHub</label>
          <input id="repo-input" name="repository" placeholder="github.com/owner/repository" autocomplete="off" required />
          <button type="submit">Abrir repositório</button>
        </form>
        <p id="form-error" class="error" role="alert"></p>
      </section>

      <section id="reader" class="reader" hidden>
        <aside class="sidebar" aria-label="Navegação do repositório">
          <div class="repo-heading">
            <button id="back-button" class="back-button" type="button">← Trocar repositório</button>
            <h2 id="repo-name"></h2>
            <p id="repo-description"></p>
            <div id="repo-meta" class="repo-meta"></div>
          </div>
          <nav aria-label="Arquivos">
            <div class="tree-header">
              <div class="tree-title">Ordem de leitura</div>
              <button id="reset-order-button" class="text-button" type="button" title="Restaurar ordem alfabética">Restaurar</button>
            </div>
            <div id="file-tree" class="file-tree"></div>
          </nav>
        </aside>

        <article class="content-panel">
          <div class="content-toolbar">
            <div id="breadcrumb" class="breadcrumb">README</div>
            <div class="reader-actions">
              <button id="previous-file-button" class="nav-button" type="button" aria-label="Documento anterior">←</button>
              <button id="next-file-button" class="nav-button" type="button" aria-label="Próximo documento">→</button>
              <a id="github-link" href="#" target="_blank" rel="noreferrer">GitHub ↗</a>
            </div>
          </div>
          <div id="loading" class="loading" hidden>Carregando…</div>
          <div id="file-content" class="file-content"></div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
